[tool.uv.workspace]
members = [
    "packages/core",
    "packages/cli",
    "packages/api",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Tests: allow long lines (test strings/fixtures) and nested `with`
"**/tests/**" = ["E501", "SIM117"]
# Alembic migrations: allow long column definitions
"**/alembic/versions/**" = ["E501"]
# CLI: allow long user-facing strings
"packages/cli/argus_cli/github_client.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/core/tests", "packages/cli/tests", "packages/api/tests"]
