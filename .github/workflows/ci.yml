name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv --quiet

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check packages/

      - name: Type check
        run: uv run mypy packages/core/argus_core packages/cli/argus_cli packages/api/argus_api

      - name: Run tests
        run: uv run pytest packages/core/tests/ -v --tb=short

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/dashboard/package-lock.json

      - run: npm ci

      - run: npm run build
