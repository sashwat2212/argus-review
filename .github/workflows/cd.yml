name: CD – Post-Deploy Verification

on:
  push:
    branches: [main]

jobs:
  verify:
    name: Verify Production Deployment
    runs-on: ubuntu-latest
    # Wait for Render and Vercel to deploy (typically 2-5 minutes)
    steps:
      - name: Wait for Render deploy
        run: sleep 120

      - name: Check API health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://argus-api.onrender.com/health)
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ API health check failed with HTTP $STATUS"
            exit 1
          fi
          echo "✅ API health check passed (HTTP $STATUS)"

      - name: Check Dashboard
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://argus-review.vercel.app)
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Dashboard health check failed with HTTP $STATUS"
            exit 1
          fi
          echo "✅ Dashboard health check passed (HTTP $STATUS)"
