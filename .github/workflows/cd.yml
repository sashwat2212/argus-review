name: CD – Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm manual deployment"
        required: true

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Guard: only deploy when CI passes ────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    # Only proceed on explicit confirm for manual runs
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy')

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Write the production .env file from GitHub Secrets
      - name: Write production .env
        run: |
          cat <<EOF > .env.production
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN_PROD }}
          GITHUB_WEBHOOK_SECRET=${{ secrets.GITHUB_WEBHOOK_SECRET }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          ARGUS_LLM_BACKEND=anthropic
          ARGUS_ANTHROPIC_MODEL=claude-haiku-4-5
          CORS_ORIGINS=["https://your-domain.com"]
          ENV=production
          EOF

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "docker-compose.yml,.env.production"
          target: "~/argus"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ~/argus

            # Rename env file
            cp .env.production .env

            # Log in to GHCR on the server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the latest images (already built by CI)
            docker compose pull api worker

            # Rolling restart: migrate first, then bring up services
            docker compose up -d --no-build postgres redis
            sleep 5

            # Run migrations via the entrypoint (api container)
            docker compose run --rm api echo "Migrations complete"

            # Bring up remaining services
            docker compose up -d --no-build

            # Clean up old images
            docker image prune -f

            echo "✅ Deployment complete: $(date)"

  # ── Post-deploy Health Check ──────────────────────────────────────────────────
  healthcheck:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for API to be ready
        run: sleep 20

      - name: Check /api/v1/health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.DEPLOY_HOST }}/api/v1/health)
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Health check failed with HTTP $STATUS"
            exit 1
          fi
          echo "✅ Health check passed (HTTP $STATUS)"
