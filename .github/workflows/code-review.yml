name: Argus Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  statuses: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv --quiet

      - name: Install argus-cli
        run: uv pip install --system "argus-cli @ git+https://github.com/${{ github.repository }}#subdirectory=packages/cli"

      - name: Set commit status pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'argus/code-review',
              description: 'Argus is reviewing your PR…',
            });

      - name: Run Argus review
        env:
          ARGUS_LLM_BACKEND: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          argus review \
            --pr ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --github-comment \
            --output-json /tmp/argus-result.json || true

      - name: Set final commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let score = 0;
            let description = 'Review failed';
            try {
              const result = JSON.parse(fs.readFileSync('/tmp/argus-result.json', 'utf8'));
              score = result.score ?? 0;
              const count = (result.findings ?? []).length;
              description = `Score: ${score}/100 · ${count} finding(s)`;
            } catch (_) {}

            const state = score >= 70 ? 'success' : score >= 50 ? 'neutral' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state,
              context: 'argus/code-review',
              description,
            });
