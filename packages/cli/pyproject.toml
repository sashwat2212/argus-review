[project]
name = "argus-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "argus-core",
    "typer[all]>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
]

[project.scripts]
argus = "argus_cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus_cli"]
