[project]
name = "argus-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "langchain-community>=0.2",
    "langchain-ollama>=0.1",
    "langchain-anthropic>=0.1",
    "langchain-groq>=0.1",
    "anthropic>=0.28",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus_core"]
